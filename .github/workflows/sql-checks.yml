name: SQL regression checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run SQLite regression tests
        run: python3 -m unittest discover -s sql -p 'test_*.py' -v
